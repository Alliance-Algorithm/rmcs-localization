rmcs_localization:
  ros__parameters:
    # 正式运行时由 launch/launch.py 以 find-pkg-share 覆盖为包内 map/ 目录，
    # 不依赖开发机绝对路径；此处仅作直接运行节点时的兜底。
    map_path: "/workspaces/RMCS/rmcs_ws/src/rmcs-navigation-deps/rmcs-localization/map/tcd-train.pcd"
    # map_path: "/workspaces/data/pcd/2026-rmuc/红方原点原始原点已纠正.pcd"
    # map_path: "/root/战队场地校准.pcd"

    frames:
      world: "world"
      odom: "odom"

    subscription:
      pointcloud: "/cloud_registered_undistort"

    debug:
      publish_registration_clouds: true

    registration:
      type: "ICP"
      initial_map_radius: 25.0
      coarse_iterations: 50
      precise_iterations: 500
      distance_threshold: 1.0
      threads: 8
      scan_angle: 15
      score_threshold: 0.01
      accept_score_threshold: 0.05
      voxel_grid:
        lx: 0.1
        ly: 0.1
        lz: 0.1
      outlier_removal:
        mean_k: 20
        stddev_mul_thresh: 0.5

    initial_world_to_odom:
      red:
        t: [0.0, 0.0, 0.0]
        q: [1.0, 0.0, 0.0, 0.0]
      blue:
        t: [20.0, 0.0, 0.0]
        q: [0.0, 0.0, 0.0, 1.0]
